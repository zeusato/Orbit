name: Build, test and release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test release preparation
        shell: pwsh
        run: ./scripts/test-release.ps1
      - name: Prepare OCR models
        shell: pwsh
        run: ./scripts/prepare-ocr.ps1
      - name: Build and test current code
        shell: pwsh
        run: ./scripts/build.ps1 -Test -ArtifactsPath artifacts/ci-build
      - name: Keep test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/tests/
          retention-days: 7
          if-no-files-found: ignore
  release:
    name: Publish new version
    needs: check
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: orbit-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether this version is already released
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $metadata = ./scripts/release-metadata.ps1
          $version = $metadata.Version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match app version' }
          $releases = gh release list --limit 1000 --json tagName,isDraft,isPrerelease | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read releases; abort instead of overwriting' }
          $matching = @($releases | Where-Object tagName -eq "v$version")
          if (@($matching | Where-Object isDraft).Count -gt 0) { throw "Draft v$version already exists. Inspect or remove the incomplete draft in GitHub Releases, then rerun; assets will not be overwritten." }
          $exists = $matching.Count -gt 0
          if (!$exists) {
            $null = ./scripts/release-metadata.ps1 -RequireNotes
            $newer = @($releases | Where-Object {
              !$_.isDraft -and !$_.isPrerelease -and $_.tagName -match '^v\d+\.\d+\.\d+$' -and [version]$_.tagName.Substring(1) -ge [version]$version
            })
            if ($newer.Count -gt 0) { throw 'A newer stable release already exists; refusing to replace Latest with an older version.' }
            $tag = git tag --list "v$version"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect tags' }
            if ($tag) {
              $tagCommit = git rev-parse "v$version^{commit}"
              if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:GITHUB_SHA) { throw 'Existing tag points to a different commit' }
            }
          }
          "publish=$((!$exists).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($exists) { Write-Output "Release v$version already exists; skipped." }
      - uses: actions/setup-dotnet@v4
        if: steps.version.outputs.publish == 'true'
        with:
          global-json-file: global.json
      - name: Load signing key
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          ORBIT_RELEASE_PRIVATE_KEY: ${{ secrets.ORBIT_RELEASE_PRIVATE_KEY }}
        run: |
          if (!$env:ORBIT_RELEASE_PRIVATE_KEY) { throw 'Missing ORBIT_RELEASE_PRIVATE_KEY secret' }
          New-Item -ItemType Directory -Path .release -Force | Out-Null
          Set-Content -LiteralPath .release/signing-key.private.pem -Value $env:ORBIT_RELEASE_PRIVATE_KEY -NoNewline
      - name: Package and sign the tested code
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: ./scripts/package.ps1 -SkipTests -RequireSignature
      - name: Exercise real updater and rollback
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: ./scripts/test-updater.ps1
      - name: Publish release automatically
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ORBIT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:ORBIT_VERSION
          gh release create "v$version" "dist/Orbit-$version-win-x64.zip" "dist/Orbit-$version-win-x64.zip.sha256" dist/orbit-update.json dist/orbit-update.json.sig --latest --title "Orbit $version" --notes-file "docs/RELEASE-$version.md" --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; do not overwrite existing release assets' }
      - name: Remove temporary signing key
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath .release/signing-key.private.pem) { Remove-Item -LiteralPath .release/signing-key.private.pem -Force }
      - name: Keep updater diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: updater-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/updater-tests/**/update-error.txt
            artifacts/updater-tests/**/.orbit-update-result.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
