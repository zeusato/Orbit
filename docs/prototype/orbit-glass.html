  const icons={png:'image',webp:'file-image',resize:'scaling',crop:'crop',background:'wand-sparkles',compress:'minimize-2'};
  const actions=[{id:'png',label:'PNG',sub:'Không mất dữ liệu',hint:'Tạo bản sao PNG',detail:'Giữ file gốc · Lưu cùng thư mục'},{id:'webp',label:'WebP',sub:'Ảnh cho web',hint:'Chuyển sang WebP',detail:'Chất lượng 85% · Lưu cùng thư mục'},{id:'resize',label:'Resize',sub:'Đổi kích thước',hint:'Thay đổi kích thước',detail:'Chọn preset hoặc nhập kích thước'},{id:'crop',label:'Crop',sub:'Cắt khung hình',hint:'Cắt khung hình',detail:'Mở trình chỉnh sửa · Lưu thành bản sao'},{id:'background',label:'Xóa nền',sub:'Tách chủ thể',hint:'Xóa hoặc thay nền',detail:'Xem trước · PNG trong suốt hoặc nền màu'},{id:'compress',label:'Nén ảnh',sub:'Giảm dung lượng',hint:'Giảm dung lượng JPEG',detail:'Điều chỉnh chất lượng trước khi lưu'}];
  const icon=(name)=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
  const photo=()=>`<div class="photo-bg"></div><div class="photo-subject"><div class="bottle-shadow"></div><div class="bottle"><div class="bottle-label"><b>FORMA</b><span>BOTANICAL CARE</span><em>DAILY WASH<br>250 ml</em></div></div></div>`;
  const esc=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const initIcons=()=>{if(globalThis.lucide)lucide.createIcons({attrs:{width:19,height:19}});};
  const saved=window.openai?.widgetState;
  const controllers=[];
  root.querySelectorAll('.orbit-ui').forEach((ui,index)=>{
    const state={screen:'menu',tool:'crop',jobs:[],ratio:'4:5',zoom:1,bg:'transparent',compare:50,quality:85,width:1200,height:1500,locked:true,shortcut:'Ctrl + Space',theme:'system',glass:true,motion:true};
    const remembered=saved?.privateContent?.variants?.[index];
    if(remembered){for(const key of ['shortcut','theme','glass','motion'])if(remembered[key]!==undefined)state[key]=remembered[key];}
    ui.innerHTML=`<div class="desktop"><div class="preview-bar"><div class="brand"><span class="logo" aria-hidden="true"></span><div><div class="brand-name">ORBIT</div><div class="brand-sub">FILE TOOLS · BẢN MẪU</div></div></div><nav class="top-actions" aria-label="Cửa sổ Orbit"><button type="button" class="icon-btn" data-screen="menu">${icon('circle-dot')}<span>Menu</span></button><button type="button" class="icon-btn" data-screen="jobs">${icon('list-checks')}<span>Tác vụ</span></button><button type="button" class="icon-btn" data-screen="settings">${icon('settings-2')}<span>Cài đặt</span></button></nav></div><div class="work-area"><div class="desktop-files"><button type="button" class="desktop-file" data-screen="menu" aria-label="Thử menu với product.jpg"><span class="file-thumb"></span><span>product.jpg</span></button><div class="desktop-file">${icon('folder')}<span>Hình sản phẩm</span></div></div><div class="radial-view" data-view="menu"><div class="file-tag">${icon('image')}<b>product.jpg</b><span>2400 × 3000</span></div><div class="radial" aria-label="Menu xử lý ảnh"><button type="button" class="radial-hub" aria-label="Kéo ảnh mẫu đến một công cụ"><span class="file-thumb"></span><span>product.jpg</span><small>Kéo để chọn</small></button></div><div class="radial-hint"><strong>Chọn công cụ cho ảnh</strong><span>Thả vào một ô để thực hiện · Esc để hủy</span></div></div><div class="glass-window" data-view="editor" hidden></div><div class="glass-window small-window" data-view="jobs" hidden></div><div class="glass-window small-window" data-view="settings" hidden></div><div class="idle-panel" data-view="idle" hidden>${icon('circle-check')}<span>Orbit sẵn sàng</span><button class="action-btn primary" type="button" data-screen="menu">Thử lại với product.jpg</button></div><div class="drag-ghost" hidden><div class="file-thumb"></div></div></div><div class="toast" role="status" aria-live="polite" hidden></div><div class="taskbar"><div class="taskbar-note"><span class="status-dot"></span><span>Bản mẫu · Không thay đổi file thật</span></div><div class="taskbar-right"><kbd data-shortcut>Ctrl + Space</kbd><span>Orbit</span></div></div></div>`;
    const radial=ui.querySelector('.radial'),hint=ui.querySelector('.radial-hint'),editor=ui.querySelector('[data-view="editor"]');
    const polar=(r,angle)=>{const a=angle*Math.PI/180;return [50+r*Math.cos(a),50+r*Math.sin(a)];};
    actions.forEach((action,i)=>{
      const center=-90+i*60,points=[];
      for(let a=center-28.7;a<=center+28.71;a+=2.05)points.push(polar(45,a));
      for(let a=center+28.7;a>=center-28.71;a-=2.05)points.push(polar(17.3,a));
      const pos=polar(32.5,center),tile=polar(34.7,center),button=document.createElement('button');
      button.type='button';button.className='wedge';button.dataset.action=action.id;button.setAttribute('aria-label',action.hint);button.style.clipPath=`polygon(${points.map(p=>p.map(v=>v.toFixed(2)+'%').join(' ')).join(',')})`;
      if(ui.dataset.layout==='tiles'){button.style.left=tile[0]+'%';button.style.top=tile[1]+'%';}
      button.innerHTML=`<span class="wedge-label" style="left:${pos[0]}%;top:${pos[1]}%">${icon(icons[action.id])}<span>${action.label}</span><small>${action.sub}</small></span>`;
      button.addEventListener('pointerenter',()=>setSelection(action.id));
      button.addEventListener('pointerleave',()=>{if(!dragging)setSelection(null);});
      button.addEventListener('focus',()=>setSelection(action.id));
      button.addEventListener('click',()=>runAction(action.id));
      radial.insertBefore(button,radial.firstChild);
    });
    let selected=null,dragging=false;
    function setSelection(id){selected=id;radial.querySelectorAll('.wedge').forEach(b=>b.classList.toggle('selected',b.dataset.action===id));const a=actions.find(x=>x.id===id);hint.querySelector('strong').textContent=a?a.hint:'Chọn công cụ cho ảnh';hint.querySelector('span').textContent=a?a.detail:'Thả vào một ô để thực hiện · Esc để hủy';}
    function save(){const variants=controllers.map(c=>({shortcut:c.state.shortcut,theme:c.state.theme,glass:c.state.glass,motion:c.state.motion}));window.openai?.setWidgetState?.({modelContent:{design:'Orbit glassmorphism',layout:ui.dataset.layout,screen:state.screen,tool:state.tool},privateContent:{variants}})?.catch(()=>{});}
    function applySettings(){ui.style.colorScheme=state.theme==='system'?'light dark':state.theme;ui.dataset.solid=String(!state.glass);ui.dataset.motion=String(state.motion);ui.querySelector('[data-shortcut]').textContent=state.shortcut;}
    function screen(name,persist=true){state.screen=name;ui.querySelectorAll('[data-view]').forEach(v=>v.hidden=v.dataset.view!==name);ui.querySelectorAll('.top-actions [data-screen]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.screen===name)));if(name==='menu')setSelection(null);if(name==='jobs')renderJobs();if(name==='settings')renderSettings();initIcons();if(persist){ui.querySelector(`[data-view="${name}"] button`)?.focus({preventScroll:true});save();}}
    function footer(label,output){return `<div class="window-foot"><div class="foot-path"><b>${output}</b>Cùng thư mục · Giữ file gốc</div><div class="button-row"><button class="action-btn" type="button" data-close>Hủy</button><button class="action-btn primary" type="button" data-save>${label}</button></div></div>`;}
    function title(label,sub,ico){return `<div class="window-head"><div class="window-title">${icon(ico)}<div><strong>${label}</strong><small>${sub}</small></div></div><button type="button" class="icon-btn" data-close aria-label="Đóng cửa sổ">${icon('x')}</button></div>`;}
    function runAction(id){state.tool=id;if(id==='png'||id==='webp'){screen('idle');addJob(id==='png'?'Chuyển thành PNG':'Chuyển thành WebP','product.'+id);return;}renderEditor(id);screen('editor');}
    function renderEditor(id){
      let side='',content=photo(),label='',output='';
      if(id==='crop'){
        label='Cắt khung hình';output='product_crop.jpg';content+=`<div class="crop-box" aria-label="Khung cắt có thể kéo; dùng phím mũi tên trong ô Dịch khung"><i class="crop-corner"></i><i class="crop-corner"></i><i class="crop-corner"></i><i class="crop-corner"></i></div>`;
        side=`<div class="control-group"><span class="control-label">Tỷ lệ khung</span><div class="segmented">${['Tự do','1:1','4:5','16:9'].map(r=>`<button type="button" class="chip" data-ratio="${r}" aria-pressed="${r===state.ratio}">${r}</button>`).join('')}</div></div><div class="control-group"><label class="control-label">Thu phóng <output data-zoom-value>${Math.round(state.zoom*100)}%</output><input hidden aria-hidden="true"></label><input class="range" type="range" aria-label="Thu phóng ảnh" min="100" max="180" value="${state.zoom*100}" data-zoom></div><div class="control-group"><span class="control-label">Dịch khung</span><div class="segmented">${[['left','arrow-left','Trái'],['up','arrow-up','Lên'],['down','arrow-down','Xuống'],['right','arrow-right','Phải']].map(([d,i,l])=>`<button class="chip" type="button" data-nudge="${d}" aria-label="Dịch khung sang ${l}">${icon(i)}</button>`).join('')}</div></div><div class="control-group"><span class="control-label">Kích thước đầu ra</span><span class="muted" data-crop-output>1728 × 2340 px</span></div>`;
      }else if(id==='background'){
        label='Xóa & thay nền';output='product_nobg.png';content=`<div class="bg-result" style="position:absolute;inset:0"></div>${photo().replace('<div class="photo-bg"></div>','')}<div class="bg-original" style="position:absolute;inset:0">${photo()}</div><div class="compare-line"></div><div class="compare-labels"><span>Ảnh gốc</span><span>Kết quả mẫu</span></div>`;
        side=`<div class="control-group"><span class="control-label">Nền đầu ra</span><div class="segmented"><button type="button" class="chip" data-bg="transparent" aria-pressed="${state.bg==='transparent'}">Trong suốt</button><button type="button" class="chip" data-bg="#e8e2d4" aria-pressed="${state.bg!=='transparent'}">Màu nền</button></div></div><div class="control-group"><span class="control-label">Màu có sẵn</span><div class="segmented">${[['#e8e2d4','Cát'],['#ffffff','Trắng'],['#2e4d47','Xanh rêu'],['#c7d3ea','Xanh nhạt']].map(([c,l])=>`<button class="swatch" type="button" data-bg="${c}" style="background:${c}" aria-label="Nền ${l}" aria-pressed="${state.bg===c}"></button>`).join('')}</div></div><div class="control-group"><label class="control-label">So sánh trước / sau</label><input class="range" type="range" aria-label="Tỷ lệ xem ảnh gốc" min="0" max="100" value="${state.compare}" data-compare></div><div class="control-group"><span class="control-label">Định dạng</span><span class="muted">PNG · Giữ kênh trong suốt</span></div>`;
      }else if(id==='resize'){
        label='Thay đổi kích thước';output='product_resized.jpg';side=`<div class="control-group"><span class="control-label">Cạnh dài</span><div class="segmented">${[1080,1920,2560].map(n=>`<button class="chip" type="button" data-preset="${n}" aria-pressed="false">${n}</button>`).join('')}</div></div><div class="control-group"><label class="control-label">Rộng (px)<input class="field" type="number" min="1" max="12000" data-width aria-label="Chiều rộng" value="${state.width}"></label><label class="control-label">Cao (px)<input class="field" type="number" min="1" max="12000" data-height aria-label="Chiều cao" value="${state.height}"></label></div><label class="check-row"><input type="checkbox" data-lock ${state.locked?'checked':''}>Giữ tỷ lệ gốc</label><span class="muted" data-resize-output>${state.width} × ${state.height} px</span>`;
      }else{
        label='Giảm dung lượng';output='product_small.jpg';side=`<div class="control-group"><label class="control-label">Chất lượng JPEG <output data-quality-value>${state.quality}%</output></label><input class="range" type="range" aria-label="Chất lượng JPEG" min="30" max="95" value="${state.quality}" data-quality></div><div class="control-group"><span class="control-label">Độ phân giải</span><span class="muted">2400 × 3000 px · Giữ nguyên</span></div><div class="control-group"><span class="control-label">Dung lượng</span><span class="muted">Được xác định sau khi mã hóa</span></div>`;
      }
      editor.innerHTML=title(label,'product.jpg · 2400 × 3000 px',icons[id])+`<div class="window-body"><div class="image-workspace"><div class="image-canvas" role="img" aria-label="Ảnh sản phẩm mẫu: chai FORMA trên nền xanh">${content}</div><div class="image-meta"><span>Ảnh minh họa</span><span>${id==='crop'?'Kéo khung để đặt vùng cắt':id==='background'?'Kéo thanh so sánh':'Xem trước'}</span></div></div><div class="settings-side">${side}</div></div>`+footer('Lưu bản sao',output);
      editor.querySelector('[data-save]').onclick=()=>{if(id==='resize'&&(!Number.isFinite(state.width)||!Number.isFinite(state.height)||state.width<1||state.height<1||state.width>12000||state.height>12000)){editor.querySelector('[data-width]').reportValidity();editor.querySelector('[data-height]').reportValidity();return;}screen('idle');addJob(label,output);};
      if(id==='crop')bindCrop();if(id==='background')bindBackground();if(id==='resize')bindResize();
      if(id==='compress')editor.querySelector('[data-quality]').oninput=e=>{state.quality=Number(e.target.value);editor.querySelector('[data-quality-value]').textContent=state.quality+'%';};
      initIcons();
    }
    function bindCrop(){
      const canvas=editor.querySelector('.image-canvas'),box=editor.querySelector('.crop-box');let frame={x:.14,y:.11,w:.72,h:.78},pointer=null;
      function draw(){box.style.left=frame.x*100+'%';box.style.top=frame.y*100+'%';box.style.width=frame.w*100+'%';box.style.height=frame.h*100+'%';editor.querySelector('[data-crop-output]').textContent=`${Math.round(2400*frame.w)} × ${Math.round(3000*frame.h)} px`;}
      function ratio(r){state.ratio=r;const p=r.split(':').map(Number),v=r==='Tự do'?1:p[0]/p[1];frame.w=.72;frame.h=r==='Tự do'?.78:frame.w*2400/(3000*v);if(frame.h>.86){frame.h=.86;frame.w=frame.h*3000*v/2400;}frame.x=(1-frame.w)/2;frame.y=(1-frame.h)/2;draw();editor.querySelectorAll('[data-ratio]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.ratio===r)));}
      function move(x,y){frame.x=Math.max(0,Math.min(1-frame.w,x));frame.y=Math.max(0,Math.min(1-frame.h,y));draw();}
      box.onpointerdown=e=>{pointer={x:e.clientX,y:e.clientY,fx:frame.x,fy:frame.y};box.setPointerCapture(e.pointerId);e.preventDefault();};
      box.onpointermove=e=>{if(!pointer)return;const b=canvas.getBoundingClientRect();move(pointer.fx+(e.clientX-pointer.x)/b.width,pointer.fy+(e.clientY-pointer.y)/b.height);};
      box.onpointerup=()=>{pointer=null;};box.onpointercancel=()=>{pointer=null;};
      editor.querySelectorAll('[data-ratio]').forEach(b=>b.onclick=()=>ratio(b.dataset.ratio));
      editor.querySelectorAll('[data-nudge]').forEach(b=>b.onclick=()=>{const d=b.dataset.nudge;move(frame.x+(d==='left'?-.02:d==='right'?.02:0),frame.y+(d==='up'?-.02:d==='down'?.02:0));});
      editor.querySelector('[data-zoom]').oninput=e=>{state.zoom=Number(e.target.value)/100;canvas.style.setProperty('--zoom',state.zoom);editor.querySelector('[data-zoom-value]').textContent=e.target.value+'%';};
      canvas.style.setProperty('--zoom',state.zoom);ratio(state.ratio);
    }
    function bindBackground(){function draw(){editor.querySelector('.bg-result').style.background=state.bg==='transparent'?'transparent':state.bg;editor.querySelector('.bg-original').style.clipPath=`inset(0 ${100-state.compare}% 0 0)`;editor.querySelector('.compare-line').style.left=state.compare+'%';editor.querySelectorAll('[data-bg]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.bg===state.bg)));}editor.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{state.bg=b.dataset.bg;draw();});editor.querySelector('[data-compare]').oninput=e=>{state.compare=Number(e.target.value);draw();};draw();}
    function bindResize(){function draw(){editor.querySelector('[data-width]').value=state.width;editor.querySelector('[data-height]').value=state.height;editor.querySelector('[data-resize-output]').textContent=state.width+' × '+state.height+' px';}editor.querySelector('[data-width]').oninput=e=>{state.width=Math.round(Number(e.target.value));if(state.locked)state.height=Math.round(state.width*1.25);draw();};editor.querySelector('[data-height]').oninput=e=>{state.height=Math.round(Number(e.target.value));if(state.locked)state.width=Math.round(state.height*.8);draw();};editor.querySelector('[data-lock]').onchange=e=>{state.locked=e.target.checked;if(state.locked){state.height=Math.round(state.width*1.25);draw();}};editor.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{state.height=Number(b.dataset.preset);state.width=Math.round(state.height*.8);state.locked=true;editor.querySelector('[data-lock]').checked=true;draw();editor.querySelectorAll('[data-preset]').forEach(p=>p.setAttribute('aria-pressed',String(p===b)));});}
    function addJob(label,filename){
      const original=filename;let n=0;while(state.jobs.some(j=>j.filename===filename&&j.status!=='cancelled')){n++;filename=original.replace(/(\.[^.]+)$/,` (${n})$1`);}
      const job={id:Date.now()+Math.random(),label,filename,status:'running',progress:0};state.jobs.unshift(job);renderToast(job);let elapsed=0;
      job.timer=setInterval(()=>{elapsed+=160;job.progress=Math.min(100,Math.round(elapsed/11.2));if(job.status==='cancelled'){clearInterval(job.timer);return;}if(job.progress>=100){job.status='done';clearInterval(job.timer);renderToast(job);}else{const bar=ui.querySelector('.toast .progress-fill');if(bar)bar.style.width=job.progress+'%';}if(state.screen==='jobs')renderJobs();},160);
    }
    function renderToast(job){const t=ui.querySelector('.toast');t.hidden=false;const done=job.status==='done',cancel=job.status==='cancelled';t.innerHTML=`${icon(cancel?'circle-x':done?'circle-check':'loader-circle')}<div class="toast-copy"><strong>${cancel?'Đã hủy':done?'Đã tạo kết quả mẫu':'Đang mô phỏng xử lý'}</strong><span>${esc(job.filename)}${done?' · File gốc được giữ lại':''}</span>${!done&&!cancel?`<div class="progress-track"><div class="progress-fill" style="width:${job.progress}%"></div></div>`:''}</div><button type="button" class="action-btn" data-toast-action>${!done&&!cancel?'Hủy':'Tác vụ'}</button><button type="button" class="icon-btn" data-toast-close aria-label="Ẩn thông báo">${icon('x')}</button>`;t.querySelector('[data-toast-action]').onclick=()=>{if(job.status==='running'){job.status='cancelled';clearInterval(job.timer);renderToast(job);if(state.screen==='jobs')renderJobs();}else screen('jobs');};t.querySelector('[data-toast-close]').onclick=()=>{t.hidden=true;};initIcons();}
    function renderJobs(){const v=ui.querySelector('[data-view="jobs"]');v.innerHTML=title('Tác vụ gần đây','Lịch sử trong bản mẫu · Chỉ mô phỏng','list-checks')+`<div class="list-body">${state.jobs.length?state.jobs.map(j=>`<div class="list-row"><div class="job-main"><span class="job-icon">${icon(j.status==='done'?'file-check':j.status==='cancelled'?'file-x':'file-clock')}</span><div class="row-copy"><strong>${esc(j.filename)}</strong><small>${esc(j.label)} · Cùng thư mục nguồn</small></div></div><span class="job-status">${j.status==='done'?'Hoàn tất':j.status==='cancelled'?'Đã hủy':j.progress+'%'}</span></div>`).join(''):`<div class="empty-state">${icon('layers-2')}<span>Chưa có tác vụ.<br>Chọn một công cụ trong menu để thử.</span><button type="button" class="action-btn" data-screen="menu">Mở menu tròn</button></div>`}</div>`;initIcons();}
    function renderSettings(){const v=ui.querySelector('[data-view="settings"]');v.innerHTML=title('Cài đặt Orbit','Tùy chỉnh trải nghiệm','settings-2')+`<div class="list-body"><div class="list-row setting-row"><div class="row-copy"><strong>Phím gọi menu</strong><small>Khi đang kéo file</small></div><select class="field" aria-label="Phím gọi menu" data-setting="shortcut">${['Ctrl + Space','Ctrl + Shift + Space'].map(s=>`<option ${state.shortcut===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="list-row setting-row"><div class="row-copy"><strong>Giao diện</strong><small>Sáng, tối hoặc theo hệ thống</small></div><select class="field" aria-label="Giao diện" data-setting="theme">${[['system','Theo hệ thống'],['light','Sáng'],['dark','Tối']].map(([v,l])=>`<option value="${v}" ${state.theme===v?'selected':''}>${l}</option>`).join('')}</select></div><label class="list-row"><div class="row-copy"><strong>Hiệu ứng kính mờ</strong><small>Tắt để dùng nền đặc, rõ chữ</small></div><input class="switch" type="checkbox" data-setting="glass" ${state.glass?'checked':''}></label><label class="list-row"><div class="row-copy"><strong>Chuyển động nhẹ</strong><small>Hiệu ứng khi chọn công cụ</small></div><input class="switch" type="checkbox" data-setting="motion" ${state.motion?'checked':''}></label><div class="list-row"><div class="row-copy"><strong>Lưu cạnh file nguồn</strong><small>Giữ bản gốc · Tự thêm số khi trùng tên</small></div>${icon('folder-check')}</div></div>`;v.querySelectorAll('[data-setting]').forEach(el=>el.onchange=()=>{state[el.dataset.setting]=el.type==='checkbox'?el.checked:el.value;applySettings();save();});}
    ui.addEventListener('click',e=>{const nav=e.target.closest('[data-screen]'),close=e.target.closest('[data-close]');if(nav)screen(nav.dataset.screen);if(close)screen('menu');});
    ui.addEventListener('keydown',e=>{if(e.key==='Escape'){dragging=false;ui.querySelector('.drag-ghost').hidden=true;screen('idle');ui.querySelector('[data-screen="menu"]').focus();}});
    const hub=ui.querySelector('.radial-hub'),ghost=ui.querySelector('.drag-ghost'),area=ui.querySelector('.work-area');
    hub.addEventListener('pointerdown',e=>{if(e.button!==0)return;dragging=true;setSelection(null);hub.setPointerCapture(e.pointerId);ghost.hidden=false;moveGhost(e);e.preventDefault();});
    function moveGhost(e){const a=area.getBoundingClientRect();ghost.style.left=e.clientX-a.left+'px';ghost.style.top=e.clientY-a.top+'px';}
    hub.addEventListener('pointermove',e=>{if(!dragging)return;moveGhost(e);const r=radial.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,dist=Math.hypot(dx,dy)/r.width;let hit=null;if(ui.dataset.layout==='tiles'){radial.querySelectorAll('.wedge').forEach(b=>{const q=b.getBoundingClientRect();if(e.clientX>=q.left&&e.clientX<=q.right&&e.clientY>=q.top&&e.clientY<=q.bottom)hit=b.dataset.action;});}else if(dist>.173&&dist<.45){const angle=((Math.atan2(dy,dx)*180/Math.PI+90)+360)%360;const index=Math.round(angle/60)%6;if(Math.abs(((angle-index*60+540)%360)-180)<28.7)hit=actions[index].id;}setSelection(hit);});
    hub.addEventListener('pointerup',()=>{if(!dragging)return;dragging=false;ghost.hidden=true;const id=selected;setSelection(null);if(id)runAction(id);});
    hub.addEventListener('pointercancel',()=>{dragging=false;ghost.hidden=true;setSelection(null);});
    controllers.push({state,applySettings});applySettings();screen('menu',false);
    if(globalThis.Tweak){const style={blur:26,radius:24,accent:'#167d72'};const tweak=new Tweak({container:ui,onChange:()=>{ui.style.setProperty('--o-blur',style.blur+'px');ui.style.setProperty('--o-radius',style.radius+'px');ui.style.setProperty('--o-accent',style.accent);}});tweak.addSlider(style,'blur',{label:'Độ mờ kính',min:0,max:40,unit:'px'});tweak.addSlider(style,'radius',{label:'Bo góc cửa sổ',min:12,max:32,unit:'px'});tweak.addColorPicker(style,'accent',{label:'Màu nhấn',reference:'--o-accent'});}
  });
  window.addEventListener('openai:set_globals',event=>{const variants=event.detail?.globals?.widgetState?.privateContent?.variants;if(!variants)return;controllers.forEach((c,i)=>{if(variants[i]){for(const key of ['shortcut','theme','glass','motion'])if(variants[i][key]!==undefined)c.state[key]=variants[i][key];c.applySettings();}});});
  initIcons();
})();
</script>
